:root{

}

.passiveWallIframe.interactive,
.passiveWallIframe.interactive iframe{

}
.liveWallApp::after{
  content:"";

  background:
    linear-gradient(0deg, rgba(116,232,255,.12) 1px, transparent 1px) 0 0/100% 9px,

#renderCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;

/* Entry screen. Deliberately just the wordmark and one button on a plain
   beige field. Earlier versions were an articulated door and then a
   see-through portal aperture; the aperture sat under the wordmark, so the
   black letters fell on the dark hall showing through and became unreadable.
   Everything here is in normal flow and centred, so nothing can overlap
   anything. The button states the loading wait plainly and only becomes the
   live ENTER control once the world has finished building (markEntryReady).
   Opening is a straight opacity fade driven per-frame from JS in lockstep
   with the camera's forward dolly (see updatePosterReveal/beginPosterOpen). */
#poster{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:34px;
  padding:24px;
  overflow:hidden;
  background:#f4ecd9;
  color:#17120d;
  transition:opacity .55s ease, visibility .55s ease;
}
#poster.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#posterCard{
  text-align:center;
  color:#17120d;
}
#posterIntroTopline{
  font:800 11px/1 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  letter-spacing:.5em;
  text-transform:uppercase;
  color:#a94c44;
  margin:0 0 14px;
}
#posterCard h1{
  margin:0;
  font-family:ui-serif, Georgia, "Times New Roman", serif;
  font-size:clamp(46px, 7.4vw, 88px);
  line-height:.92;
  font-weight:700;
  letter-spacing:.16em;
  text-indent:.16em;
  text-transform:uppercase;
  color:#17120d;
}
#posterCard h1::after{
  content:"";
  display:block;
  width:132px;
  height:3px;
  margin:16px auto 0;
  background:linear-gradient(90deg, #a94c44, #e6a12e 46%, #6db7c9);
}
#posterSubtitle{
  margin:14px 0 0;
  font:600 10px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:rgba(23,18,13,.55);
}
#posterEnter{
  padding:15px 52px;
  font:800 13px/1 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  letter-spacing:.42em;
  text-indent:.42em;
  text-transform:uppercase;
  color:#17120d;
  background:transparent;
  border:2px solid #17120d;
  border-radius:2px;
  cursor:pointer;
  transition:background .2s ease, color .2s ease, opacity .2s ease;
}
#posterEnter:not([disabled]):hover,
#posterEnter:not([disabled]):focus-visible{
  background:#17120d;
  color:#f4ecd9;
  outline:none;
}
/* Loading is stated plainly on the button itself, so the wait is legible
   instead of looking like a dead control. */
#posterEnter[disabled]{
  cursor:default;
  opacity:.45;
  border-style:dashed;
}
@media (prefers-reduced-motion: no-preference){
  #posterEnter[disabled]{ animation:posterWait 1.5s ease-in-out infinite; }
}
@keyframes posterWait{ 0%,100%{opacity:.32} 50%{opacity:.62} }
#posterControls,.ctrlGroup,.keyRow,.key,.ctrlIcon,.ctrlLabel{display:none}

#poster.opening #posterCard,
#poster.opening #posterEnter{ opacity:0; transition:opacity .4s ease; }

@media (max-width:820px){
  #posterCard h1{ font-size:clamp(40px, 10vw, 60px); }
}

// Runtime performance ladder (batch 127): if the average frame stays above
// ~42 ms across a 4-second window, step the pixel ratio down once (max two
// steps, floor 0.85) instead of letting weak devices grind.
// Bidirectional performance ladder: sample average frame time over a 2 s
// window and adjust pixel ratio both ways. Ease DOWN when frames are slow
// (>33 ms â‰ˆ 30 fps) toward a floor of 60% of the initial DPR; RESTORE up
// toward that initial DPR (the ceiling) when there is headroom (<22 ms â‰ˆ
// 45 fps). A dead zone between the two thresholds prevents oscillation.
let perfAccum = 0, perfFrames = 0, perfBasePR = 0;
function updatePerformanceLadder(dt){
  perfAccum += dt; perfFrames++;
  if(perfAccum < 2) return;
  const avg = perfAccum / perfFrames;
  perfAccum = 0; perfFrames = 0;
  if(!perfBasePR) perfBasePR = renderer.getPixelRatio();   // initial/adaptive DPR = ceiling
  const cur = renderer.getPixelRatio();
  let next = cur;
  if(avg > 0.033 && cur > perfBasePR*0.6) next = Math.max(perfBasePR*0.6, cur*0.85);
  else if(avg < 0.022 && cur < perfBasePR) next = Math.min(perfBasePR, cur*1.12);
  if(Math.abs(next - cur) > 0.001){
    renderer.setPixelRatio(next);
    renderer.setSize(innerWidth, innerHeight);
    if(cssRenderer) cssRenderer.setSize(innerWidth, innerHeight);
    if(next < cur) msg('Performance mode: resolution eased');
  }
}

        const burstB = Math.sin(t*(g.speed*1.53) + g.phase*1.1) > 0.997 ? 0.62 : 1;
