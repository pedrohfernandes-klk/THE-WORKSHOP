<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'unsafe-inline'; img-src https: data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src https://www.youtube.com">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HrM · YouTube relay</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  #player{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="player"></div>
<script>
// HrM Workshop — YouTube relay (upload this file to any of your GitHub Pages
// repos, e.g. next to SAYWHAT). Because this page is served over https, the
// inner YouTube embed gets a valid referer and plays even when the museum
// itself is opened from a local file:// URL (which otherwise causes Error 153).
//
// Usage from the museum:
//   yt.html?v=VIDEO_ID           — play one video (looping)
//   yt.html?list=PLAYLIST_ID     — play a playlist
// The embedding museum can control playback by posting messages to this window:
//   {func:'playVideo'|'pauseVideo'|'stopVideo'|'mute'|'unMute'}
//   {func:'setVolume', args:[0-100]}
// or the YT-style {"event":"command","func":...} JSON string. Only those verbs
// are accepted, and only from the framing page — see the listener below.
var params = new URLSearchParams(location.search);
var videoId = params.get('v') || 'jfKfPfyJRdk';
var listId = params.get('list') || '';

var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

var player = null;
window.onYouTubeIframeAPIReady = function(){
  var opts = {
    width:'100%', height:'100%',
    playerVars:{
      autoplay:1, mute:1, playsinline:1, controls:1,
      loop: listId ? 0 : 1,
      playlist: listId ? undefined : videoId,
      rel:0, modestbranding:1
    },
    events:{
      onReady:function(e){ e.target.mute(); e.target.playVideo(); }
    }
  };
  if(listId){
    opts.playerVars.listType = 'playlist';
    opts.playerVars.list = listId;
  }else{
    opts.videoId = videoId;
  }
  player = new YT.Player('player', opts);
};

// Only the page that framed this relay may drive it, and only through the
// playback verbs listed here. Without these checks any site could frame this
// public page and invoke arbitrary YT.Player methods with arbitrary arguments.
//
// An origin allowlist cannot carry the weight on its own: the relay exists so a
// museum opened from file:// can embed YouTube, and a file:// page posts with
// origin "null". ev.source is therefore the real gate.
var ALLOWED_FUNCS = {
  playVideo:1, pauseVideo:1, stopVideo:1, mute:1, unMute:1, setVolume:1
};

window.addEventListener('message', function(ev){
  // Reject anything that is not the embedding page. Sibling frames and
  // window.open handles are not window.parent.
  if(ev.source !== window.parent) return;

  var data = ev.data;
  if(typeof data === 'string'){
    try{ data = JSON.parse(data); }catch(e){ return; }
  }
  if(!data || typeof data !== 'object') return;

  var func = data.func || (data.event === 'command' ? data.func : null);
  if(typeof func !== 'string') return;
  // Own-property check, so inherited keys ('constructor', 'toString') cannot
  // pass as commands.
  if(!Object.prototype.hasOwnProperty.call(ALLOWED_FUNCS, func)) return;
  if(!player || typeof player[func] !== 'function') return;

  // setVolume is the only verb that takes an argument. Clamp it rather than
  // forwarding whatever arrived.
  var args = [];
  if(func === 'setVolume'){
    var vol = Array.isArray(data.args) ? Number(data.args[0]) : NaN;
    if(!isFinite(vol)) return;
    args = [Math.max(0, Math.min(100, vol))];
  }

  try{ player[func].apply(player, args); }catch(e){}
});
</script>
</body>
</html>
